<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <title>Мой Дневник</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #151c2c;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --danger-bg: rgba(244, 63, 94, 0.12);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding-bottom: 90px; 
            background-color: var(--bg-color); 
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Шапка */
        .header { 
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px; 
            text-align: center; 
            border-bottom: 1px solid var(--card-border);
        }
        .header h1 { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 700; 
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Контент вкладок */
        .tab-content { display: none; padding: 18px 16px; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* Карточки */
        .card { 
            background: var(--card-bg); 
            padding: 18px; 
            border-radius: 18px; 
            margin-bottom: 16px; 
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Карточка баланса */
        .balance-card {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            color: #ffffff;
            border: none;
            padding: 22px 18px;
            box-shadow: 0 12px 30px -5px rgba(79, 70, 229, 0.4);
        }

        label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 6px; display: block; }
        
        input, textarea, select { 
            width: 100%; 
            padding: 12px 14px; 
            margin-top: 2px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--card-border); 
            font-size: 15px; 
            outline: none; 
            background: #0d121f; 
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, textarea:focus { 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        input::placeholder, textarea::placeholder { color: #475569; }

        .btn-group { display: flex; gap: 10px; margin-top: 4px; }
        .btn-group button { margin-bottom: 0; }

        button { 
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600; 
            border: none; 
            border-radius: 12px;
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active { transform: scale(0.98); }
        
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-red { background: var(--accent-red); color: white; }
        
        /* Элементы списка */
        .list-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex-grow: 1; padding-right: 12px; }
        .item-title { font-weight: 600; font-size: 15px; color: var(--text-primary); line-height: 1.4; }
        .item-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        
        .badge {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #cbd5e1;
        }

        .del-btn { 
            background: var(--danger-bg); 
            color: var(--accent-red); 
            width: auto; 
            padding: 6px 10px; 
            margin: 0; 
            border-radius: 8px; 
            font-size: 12px; 
        }

        .done-task .item-title { text-decoration: line-through; color: #475569; }
        
        .income-text { color: var(--accent-green); font-weight: 700; font-size: 16px; }
        .expense-text { color: var(--accent-red); font-weight: 700; font-size: 16px; }

        /* Нижнее навигационное меню */
        .nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex; 
            border-top: 1px solid var(--card-border); 
            padding-bottom: env(safe-area-inset-bottom, 8px);
            z-index: 100;
        }
        .nav button { 
            flex: 1; 
            margin: 0; 
            padding: 10px 0 8px 0; 
            border-radius: 0; 
            border: none; 
            background: transparent; 
            color: var(--text-secondary); 
            font-size: 11px; 
            font-weight: 500;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
        }
        .nav button.active { color: var(--accent-primary); font-weight: 600; }
        .nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Мой Дневник</h1>
    </div>

    <!-- Вкладка: Дела -->
    <div id="tasks" class="tab-content active">
        <div class="card">
            <label>Новая задача или заметка</label>
            <textarea id="taskText" rows="3" placeholder="Запиши мысли, задачи, планер..."></textarea>
            <button class="btn-primary" onclick="addTask()">Сохранить запись</button>
        </div>
        <div class="card">
            <label>Список дел</label>
            <div id="tasksList"></div>
        </div>
    </div>

    <!-- Вкладка: Тренировки -->
    <div id="workouts" class="tab-content">
        <div class="card">
            <label>Упражнение</label>
            <input type="text" id="workEx" placeholder="Например: Жим штанги лежа">
            <div style="display: flex; gap: 10px;">
                <div style="flex:1;">
                    <label>Вес (кг)</label>
                    <input type="number" id="workWeight" placeholder="80">
                </div>
                <div style="flex:1;">
                    <label>Подходы х Повторы</label>
                    <input type="text" id="workSets" placeholder="4х10">
                </div>
            </div>
            <button class="btn-primary" onclick="addWorkout()">Записать подход</button>
        </div>
        <div class="card">
            <label>История тренировок</label>
            <div id="workoutsList"></div>
        </div>
    </div>

    <!-- Вкладка: Финансы -->
    <div id="finance" class="tab-content">
        <div class="card balance-card">
            <span style="font-size: 12px; opacity: 0.9; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Текущий баланс</span>
            <h1 style="margin: 8px 0 0 0; font-size: 36px; font-weight: 800; tracking: -1px;"><span id="balanceVal">0</span> ₼</h1>
        </div>
        <div class="card">
            <label>Сумма</label>
            <input type="number" id="finAmount" placeholder="0">
            <label>Категория / Описание</label>
            <input type="text" id="finTitle" placeholder="Продукты, зарплата, заправка...">
            <div class="btn-group">
                <button class="btn-green" onclick="addFinance('income')">+ Доход</button>
                <button class="btn-red" onclick="addFinance('expense')">- Расход</button>
            </div>
        </div>
        <div class="card">
            <label>История операций</label>
            <div id="financeList"></div>
        </div>
    </div>

    <!-- Вкладка: Бэкап -->
    <div id="settings" class="tab-content">
        <div class="card">
            <label>Резервное копирование</label>
            <p style="font-size: 13px; color: var(--text-secondary); margin: 4px 0 14px 0; line-height: 1.5;">Сохрани файл с данными, чтобы перенести дневник на другой телефон или не потерять историю.</p>
            <button class="btn-primary" onclick="exportData()">📥 Скачать бэкап (JSON)</button>
            
            <label style="margin-top: 20px;">Восстановить из файла</label>
            <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        </div>
        <div class="card">
            <button class="btn-red" onclick="clearAllData()">⚠️ Сбросить все данные</button>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="nav">
        <button onclick="openTab('tasks')" class="active" id="btn-tasks">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            <span>Заметки</span>
        </button>
        <button onclick="openTab('workouts')" id="btn-workouts">
            <svg viewBox="0 0 24 24"><path d="M18 8h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/><path d="M6 8H5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"/><path d="M8 6h8v12H8z"/><path d="M12 6v12"/></svg>
            <span>Зал</span>
        </button>
        <button onclick="openTab('finance')" id="btn-finance">
            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M6 12h.01M18 12h.01"/></svg>
            <span>Финансы</span>
        </button>
        <button onclick="openTab('settings')" id="btn-settings">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Бэкап</span>
        </button>
    </div>

    <script>
        // Инициализация данных
        let tasks = JSON.parse(localStorage.getItem('my_tasks') || '[]');
        let workouts = JSON.parse(localStorage.getItem('my_workouts') || '[]');
        let finance = JSON.parse(localStorage.getItem('my_finance') || '[]');

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        function getTodayDate() {
            const d = new Date();
            return d.getDate().toString().padStart(2, '0') + '.' + (d.getMonth() + 1).toString().padStart(2, '0') + '.' + d.getFullYear();
        }

        // --- ДЕЛА ---
        function addTask() {
            const text = document.getElementById('taskText').value.trim();
            if (!text) return;
            tasks.unshift({ id: Date.now(), text: text, done: false, date: getTodayDate() });
            saveAndRender();
            document.getElementById('taskText').value = '';
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        }

        function renderTasks() {
            const container = document.getElementById('tasksList');
            if (tasks.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:13px;">Записей пока нет</p>'; return; }
            container.innerHTML = tasks.map(t => `
                <div class="list-item ${t.done ? 'done-task' : ''}">
                    <div class="item-info" onclick="toggleTask(${t.id})" style="cursor:pointer;">
                        <div class="item-title">${t.done ? '✓ ' : ''}${escapeHtml(t.text)}</div>
                        <div class="item-sub"><span class="badge">${t.date}</span></div>
                    </div>
                    <button class="del-btn" onclick="deleteTask(${t.id})">Удалить</button>
                </div>
            `).join('');
        }

        // --- ТРЕНИРОВКИ ---
        function addWorkout() {
            const ex = document.getElementById('workEx').value.trim();
            const weight = document.getElementById('workWeight').value.trim();
            const sets = document.getElementById('workSets').value.trim();
            if (!ex) return;

            workouts.unshift({ id: Date.now(), ex, weight: weight || '0', sets: sets || '-', date: getTodayDate() });
            saveAndRender();
            document.getElementById('workEx').value = '';
            document.getElementById('workWeight').value = '';
            document.getElementById('workSets').value = '';
        }

        function deleteWorkout(id) {
            workouts = workouts.filter(w => w.id !== id);
            saveAndRender();
        }

        function renderWorkouts() {
            const container = document.getElementById('workoutsList');
            if (workouts.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:13px;">Нет записей о тренировках</p>'; return; }
            container.innerHTML = workouts.map(w => `
                <div class="list-item">
                    <div class="item-info">
                        <div class="item-title">${escapeHtml(w.ex)}</div>
                        <div class="item-sub">
                            <span class="badge">🏋️ ${w.weight} кг</span>
                            <span class="badge">🔁 ${escapeHtml(w.sets)}</span>
                            <span class="badge">${w.date}</span>
                        </div>
                    </div>
                    <button class="del-btn" onclick="deleteWorkout(${w.id})">Удалить</button>
                </div>
            `).join('');
        }

        // --- ФИНАНСЫ ---
        function addFinance(type) {
            const amount = parseFloat(document.getElementById('finAmount').value);
            const title = document.getElementById('finTitle').value.trim();
            if (!amount || amount <= 0) return;

            finance.unshift({ id: Date.now(), type, amount, title: title || (type === 'income' ? 'Доход' : 'Расход'), date: getTodayDate() });
            saveAndRender();
            document.getElementById('finAmount').value = '';
            document.getElementById('finTitle').value = '';
        }

        function deleteFinance(id) {
            finance = finance.filter(f => f.id !== id);
            saveAndRender();
        }

        function renderFinance() {
            const container = document.getElementById('financeList');
            let balance = 0;
            finance.forEach(f => {
                if (f.type === 'income') balance += f.amount;
                else balance -= f.amount;
            });
            document.getElementById('balanceVal').innerText = balance.toLocaleString();

            if (finance.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:13px;">История финансов пуста</p>'; return; }

            container.innerHTML = finance.map(f => `
                <div class="list-item">
                    <div class="item-info">
                        <div class="item-title">${escapeHtml(f.title)}</div>
                        <div class="item-sub"><span class="badge">${f.date}</span></div>
                    </div>
                    <div style="margin-right:12px;" class="${f.type === 'income' ? 'income-text' : 'expense-text'}">
                        ${f.type === 'income' ? '+' : '-'}${f.amount} ₼
                    </div>
                    <button class="del-btn" onclick="deleteFinance(${f.id})">✕</button>
                </div>
            `).join('');
        }

        // --- БЭКАП И ВСПОМОГАТЕЛЬНЫЕ ---
        function saveAndRender() {
            localStorage.setItem('my_tasks', JSON.stringify(tasks));
            localStorage.setItem('my_workouts', JSON.stringify(workouts));
            localStorage.setItem('my_finance', JSON.stringify(finance));
            renderTasks();
            renderWorkouts();
            renderFinance();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ tasks, workouts, finance }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `diary_backup_${getTodayDate()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(e) {
            const fileReader = new FileReader();
            fileReader.onload = function (event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.tasks) tasks = data.tasks;
                    if (data.workouts) workouts = data.workouts;
                    if (data.finance) finance = data.finance;
                    saveAndRender();
                    alert('Данные успешно восстановлены!');
                } catch (err) { alert('Ошибка при чтении файла бэкапа'); }
            };
            fileReader.readAsText(e.target.files[0]);
        }

        function clearAllData() {
            if (confirm('Удалить абсолютно все записи из приложения?')) {
                localStorage.clear();
                tasks = []; workouts = []; finance = [];
                saveAndRender();
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Первичный рендер при старте
        saveAndRender();

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    </script>
</body>
</html>
