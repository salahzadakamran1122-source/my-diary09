<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121619">
    <title>Мой Дневник</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0f1315;
            --card-bg: #171d20;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ecf0ed;
            --text-secondary: #829288;
            --accent: #347852;
            --accent-green: #297a4d;
            --accent-red: #bd4c46;
            --input-bg: #111618;
            --header-bg: rgba(15, 19, 21, 0.9);
            --badge-bg: rgba(255, 255, 255, 0.06);

            /* Стикеры */
            --st-sage: #182c23;
            --st-sand: #2a2319;
            --st-clay: #2b1b19;
            --st-ocean: #162430;
        }

        body.light-theme {
            --bg-color: #f4f3ef;
            --card-bg: #ffffff;
            --card-border: #e3e0d8;
            --text-primary: #18201c;
            --text-secondary: #65746b;
            --accent: #27563f;
            --accent-green: #216941;
            --accent-red: #af3e38;
            --input-bg: #f9f8f4;
            --header-bg: rgba(244, 243, 239, 0.9);
            --badge-bg: #eae7e0;

            --st-sage: #e1eee5;
            --st-sand: #f6efe2;
            --st-clay: #f6e7e4;
            --st-ocean: #e1ebf1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding-top: 105px; 
            padding-bottom: 30px;
            background-color: var(--bg-color); 
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Центрирующий узкий контейнер для аккуратности */
        .app-container {
            max-width: 580px;
            margin: 0 auto;
            padding: 0 14px;
        }

        /* Шапка */
        .top-container {
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
        }

        .header-inner {
            max-width: 580px;
            margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px;
        }

        .header-inner h1 { margin: 0; font-size: 16px; font-weight: 700; }

        .icon-btn {
            background: transparent; border: none; color: var(--text-primary);
            padding: 6px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:active { background: var(--card-border); }
        .icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Табы-сегменты */
        .nav-wrapper { max-width: 580px; margin: 0 auto; padding: 0 10px 8px 10px; }
        .nav { display: flex; background: var(--input-bg); padding: 3px; border-radius: 12px; border: 1px solid var(--card-border); }
        .nav button { 
            flex: 1; padding: 6px 0; border: none; border-radius: 9px;
            background: transparent; color: var(--text-secondary); 
            font-size: 11px; font-weight: 600; display: flex; 
            flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
            transition: all 0.15s;
        }
        .nav button.active { background: var(--card-bg); color: var(--text-primary); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
        .nav button.active svg { stroke: var(--accent); }
        .nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Карточки */
        .card { 
            background: var(--card-bg); 
            padding: 14px; 
            border-radius: 16px; 
            margin-bottom: 12px; 
            border: 1px solid var(--card-border);
        }

        /* Приветственный Баннер */
        .welcome-card {
            background: linear-gradient(135deg, #1d3629 0%, #12241b 100%);
            color: #e8ece9; border: 1px solid rgba(255,255,255,0.1);
            padding: 16px; border-radius: 18px; margin-bottom: 14px;
        }
        body.light-theme .welcome-card { background: linear-gradient(135deg, #27563f 0%, #193b2a 100%); color: #ffffff; }

        .stats-grid { display: flex; gap: 8px; margin-top: 10px; }
        .stat-badge { flex: 1; background: rgba(255,255,255,0.08); padding: 8px; border-radius: 10px; text-align: center; font-size: 10.5px; }
        .stat-badge strong { display: block; font-size: 14px; margin-top: 2px; }

        /* Доска Стиреров */
        .stickers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
        .sticker-card {
            padding: 12px; border-radius: 14px; min-height: 110px;
            display: flex; flex-direction: column; justify-content: space-between;
            border: 1px solid var(--card-border); word-break: break-word;
        }
        .sticker-card.sage { background-color: var(--st-sage); }
        .sticker-card.sand { background-color: var(--st-sand); }
        .sticker-card.clay { background-color: var(--st-clay); }
        .sticker-card.ocean { background-color: var(--st-ocean); }

        .sticker-tag { font-size: 9.5px; font-weight: 700; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
        .sticker-text { font-size: 13px; font-weight: 500; line-height: 1.35; white-space: pre-wrap; }
        .sticker-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 10.5px; opacity: 0.75; }
        .mini-btn { background: rgba(0,0,0,0.15); border: none; padding: 3px 6px; border-radius: 5px; font-size: 10.5px; cursor: pointer; color: inherit; }

        /* ЭЛЕМЕНТЫ ФОРМ И КОМПАКТНЫЙ ВИДЖЕТ ВВОДА */
        label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 5px; display: block; }
        
        input, select, textarea {
            width: 100%; padding: 9px 11px; border-radius: 10px; 
            border: 1px solid var(--card-border); font-size: 13.5px; 
            outline: none; background: var(--input-bg); color: var(--text-primary);
        }

        /* Виджет быстрой заметки (Google Keep style) */
        .note-widget {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .note-widget textarea {
            border: none; background: transparent; padding: 0;
            resize: none; font-size: 14px; margin-bottom: 8px;
        }
        .note-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--card-border); padding-top: 8px; gap: 6px;
        }
        .note-tools-left { display: flex; align-items: center; gap: 8px; }
        
        .color-picker-mini { display: flex; gap: 6px; }
        .color-opt { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .color-opt.selected { border-color: var(--text-primary); transform: scale(1.15); }

        /* Компактные Кнопки */
        .btn-compact {
            padding: 7px 14px; font-size: 12.5px; font-weight: 600;
            border-radius: 9px; border: none; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            white-space: nowrap;
        }
        .btn-compact:active { opacity: 0.8; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-green { background: var(--accent-green); color: white; }
        .btn-red { background: var(--accent-red); color: white; }

        /* Сетки для компактных форм */
        .form-grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

        /* Подвкладки внутри Финансов */
        .sub-nav { display: flex; background: var(--input-bg); padding: 3px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--card-border); }
        .sub-nav button {
            flex: 1; padding: 6px; border-radius: 8px; border: none;
            background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .sub-nav button.active { background: var(--card-bg); color: var(--text-primary); }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
        .calc-btn { padding: 12px; font-size: 16px; font-weight: 600; border-radius: 10px; border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; text-align: center; }
        .calc-btn.op { background: var(--accent); color: white; }

        /* Список элементов */
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--card-border); }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex-grow: 1; padding-right: 8px; }
        .item-title { font-weight: 600; font-size: 13.5px; color: var(--text-primary); }
        .item-sub { font-size: 11px; color: var(--text-secondary); margin-top: 3px; display: flex; gap: 5px; }
        
        .badge { background: var(--badge-bg); padding: 2px 6px; border-radius: 5px; font-size: 10px; }
        .del-btn { background: rgba(189, 76, 70, 0.12); color: var(--accent-red); padding: 4px 8px; border-radius: 6px; font-size: 11px; border: none; cursor: pointer; }

        /* Шторка Поиска */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; visibility: hidden; transition: all 0.2s; }
        .drawer-overlay.active { opacity: 1; visibility: visible; }
        .drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card-bg); z-index: 201; padding: 16px; transition: transform 0.2s; border-right: 1px solid var(--card-border); }
        .drawer.active { transform: translateX(280px); }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="top-container">
        <div class="header-inner">
            <button class="icon-btn" onclick="toggleDrawer()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
            <h1>Мой Дневник</h1>
            <button class="icon-btn" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>

        <div class="nav-wrapper">
            <div class="nav">
                <button onclick="openTab('home')" class="active" id="btn-home">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Главная</span>
                </button>
                <button onclick="openTab('tasks')" id="btn-tasks">
                    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <span>Заметки</span>
                </button>
                <button onclick="openTab('workouts')" id="btn-workouts">
                    <svg viewBox="0 0 24 24"><path d="M18 8h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/><path d="M6 8H5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"/><path d="M8 6h8v12H8z"/><path d="M12 6v12"/></svg>
                    <span>Зал</span>
                </button>
                <button onclick="openTab('finance')" id="btn-finance">
                    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                    <span>Финансы</span>
                </button>
                <button onclick="openTab('settings')" id="btn-settings">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Бэкап</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Поиск -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; font-size:15px;">Поиск по дневнику</h3>
            <button class="icon-btn" onclick="toggleDrawer()">✕</button>
        </div>
        <input type="text" id="searchInput" placeholder="Найти запись..." oninput="searchEntries()" style="margin-top:12px;">
        <div id="searchResults" style="max-height: 70vh; overflow-y: auto;"></div>
    </div>

    <!-- Основной Контейнер -->
    <div class="app-container">
        
        <!-- Вкладка 1: ГЛАВНАЯ -->
        <div id="home" class="tab-content" style="display:block;">
            <div class="welcome-card">
                <h2 style="margin:0; font-size: 18px;">👋 Рад видеть тебя!</h2>
                <p style="margin: 4px 0 0 0; font-size: 12px; opacity: 0.85;" id="currentDateStr">Загрузка даты...</p>
                
                <div class="stats-grid">
                    <div class="stat-badge">Заметки<strong id="statNotesCount">0</strong></div>
                    <div class="stat-badge">Баланс<strong id="statBalance">0 ₼</strong></div>
                    <div class="stat-badge">Тренировки<strong id="statWorkoutsCount">0</strong></div>
                </div>
            </div>

            <label style="margin-bottom:6px;">📌 Доска записей и результатов</label>
            <div id="stickersBoard" class="stickers-grid"></div>
        </div>

        <!-- Вкладка 2: ЗАМЕТКИ (Компактный виджет) -->
        <div id="tasks" class="tab-content" style="display:none;">
            
            <div class="note-widget">
                <textarea id="taskText" rows="3" placeholder="Напиши заметку, рецепт или мысль..."></textarea>
                
                <div class="note-toolbar">
                    <div class="note-tools-left">
                        <select id="noteCategory" style="width: auto; padding: 4px 8px; font-size: 11.5px;">
                            <option value="Заметка">📝 Заметка</option>
                            <option value="Рецепт">🥗 Рецепт</option>
                            <option value="Идея">💡 Идея</option>
                            <option value="Важное">⚠️ Важное</option>
                        </select>

                        <div class="color-picker-mini">
                            <div class="color-opt selected" style="background:#297a4d;" onclick="selectStickerColor('sage', this)"></div>
                            <div class="color-opt" style="background:#a3855c;" onclick="selectStickerColor('sand', this)"></div>
                            <div class="color-opt" style="background:#bd4c46;" onclick="selectStickerColor('clay', this)"></div>
                            <div class="color-opt" style="background:#326587;" onclick="selectStickerColor('ocean', this)"></div>
                        </div>
                    </div>

                    <div style="display:flex; gap:6px;">
                        <button class="btn-compact" id="cancelEditBtn" onclick="resetNoteForm()" style="display:none; background:var(--badge-bg); color:var(--text-primary);">Отмена</button>
                        <button class="btn-compact btn-primary" id="saveNoteBtn" onclick="saveNote()">+ Сохранить</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <label>Все твои записи</label>
                <div id="tasksList"></div>
            </div>
        </div>

        <!-- Вкладка 3: ТРЕНИРОВКИ (Компактная форма) -->
        <div id="workouts" class="tab-content" style="display:none;">
            <div class="card">
                <label>Записать подход</label>
                <div class="form-grid-3">
                    <input type="text" id="workEx" placeholder="Упражнение">
                    <input type="number" id="workWeight" placeholder="Вес (кг)">
                    <input type="text" id="workSets" placeholder="Подходы">
                </div>
                <div style="display:flex; justify-height:center; justify-content:flex-end;">
                    <button class="btn-compact btn-primary" onclick="addWorkout()">+ Сохранить</button>
                </div>
            </div>
            
            <div class="card">
                <label>История в зале</label>
                <div id="workoutsList"></div>
            </div>
        </div>

        <!-- Вкладка 4: ФИНАНСЫ (Компактная форма) -->
        <div id="finance" class="tab-content" style="display:none;">
            <div class="sub-nav">
                <button class="active" id="subBtnOps" onclick="switchFinSubTab('ops')">💳 Операции</button>
                <button id="subBtnCalc" onclick="switchFinSubTab('calc')">🧮 Калькулятор</button>
            </div>

            <div id="finSubOps">
                <div class="card" style="background: linear-gradient(135deg, #27563f 0%, #173727 100%); color:#fff; border:none; padding:12px 16px;">
                    <span style="font-size: 10.5px; text-transform: uppercase; opacity: 0.85;">Текущий Баланс</span>
                    <h1 style="margin: 2px 0 0 0; font-size: 26px;"><span id="balanceVal">0</span> ₼</h1>
                </div>
                
                <div class="card">
                    <div class="form-grid-2">
                        <div>
                            <label>Сумма (₼)</label>
                            <input type="number" id="finAmount" placeholder="0">
                        </div>
                        <div>
                            <label>Категория</label>
                            <input type="text" id="finTitle" placeholder="Еда, Зарплата...">
                        </div>
                    </div>
                    <div style="display:flex; justify-content:flex-end; gap:6px;">
                        <button class="btn-compact btn-green" onclick="addFinance('income')">+ Доход</button>
                        <button class="btn-compact btn-red" onclick="addFinance('expense')">- Расход</button>
                    </div>
                </div>

                <div class="card">
                    <label>История операций</label>
                    <div id="financeList"></div>
                </div>
            </div>

            <div id="finSubCalc" style="display:none;">
                <div class="card">
                    <label>Быстрый расчет</label>
                    <input type="text" id="calcDisplay" readonly value="0" style="font-size:20px; text-align:right; font-weight:700;">
                    
                    <div class="calc-grid">
                        <button class="calc-btn" onclick="calcInput('C')">C</button>
                        <button class="calc-btn" onclick="calcInput('⌫')">⌫</button>
                        <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                        <button class="calc-btn op" onclick="calcInput('*')">×</button>

                        <button class="calc-btn" onclick="calcInput('7')">7</button>
                        <button class="calc-btn" onclick="calcInput('8')">8</button>
                        <button class="calc-btn" onclick="calcInput('9')">9</button>
                        <button class="calc-btn op" onclick="calcInput('-')">-</button>

                        <button class="calc-btn" onclick="calcInput('4')">4</button>
                        <button class="calc-btn" onclick="calcInput('5')">5</button>
                        <button class="calc-btn" onclick="calcInput('6')">6</button>
                        <button class="calc-btn op" onclick="calcInput('+')">+</button>

                        <button class="calc-btn" onclick="calcInput('1')">1</button>
                        <button class="calc-btn" onclick="calcInput('2')">2</button>
                        <button class="calc-btn" onclick="calcInput('3')">3</button>
                        <button class="calc-btn op" onclick="calcEquals()" style="grid-row: span 2; display:flex; align-items:center; justify-content:center;">=</button>

                        <button class="calc-btn" onclick="calcInput('0')" style="grid-column: span 2;">0</button>
                        <button class="calc-btn" onclick="calcInput('.')">.</button>
                    </div>

                    <div style="display:flex; justify-content:flex-end; margin-top:10px;">
                        <button class="btn-compact btn-primary" onclick="copyCalcToFinance()">Вставить в сумму</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладка 5: БЭКАП -->
        <div id="settings" class="tab-content" style="display:none;">
            <div class="card">
                <label>Резервное копирование</label>
                <p style="font-size: 12px; color: var(--text-secondary); margin-top: 0;">Скачай файл для переноса данных между устройствами.</p>
                <button class="btn-compact btn-primary" onclick="exportData()">📥 Скачать бэкап (JSON)</button>
                <label style="margin-top: 14px;">Восстановить из файла</label>
                <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="font-size:12px;">
            </div>
            <div class="card">
                <button class="btn-compact btn-red" onclick="clearAllData()">⚠️ Сбросить данные</button>
            </div>
        </div>

    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('my_notes') || '[]');
        let workouts = JSON.parse(localStorage.getItem('my_workouts') || '[]');
        let finance = JSON.parse(localStorage.getItem('my_finance') || '[]');
        
        let selectedColor = 'sage';
        let editingNoteId = null;

        if (localStorage.getItem('my_theme') === 'light') document.body.classList.add('light-theme');
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('my_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('active');
            document.getElementById('drawerOverlay').classList.toggle('active');
        }

        function searchEntries() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('searchResults');
            if (!query) { container.innerHTML = ''; return; }

            let html = '';
            notes.filter(n => n.text.toLowerCase().includes(query)).forEach(n => {
                html += `<div class="list-item"><div class="item-info"><div class="item-title">📌 ${escapeHtml(n.text)}</div></div></div>`;
            });
            workouts.filter(w => w.ex.toLowerCase().includes(query)).forEach(w => {
                html += `<div class="list-item"><div class="item-info"><div class="item-title">🏋️ ${escapeHtml(w.ex)}</div></div></div>`;
            });
            finance.filter(f => f.title.toLowerCase().includes(query)).forEach(f => {
                html += `<div class="list-item"><div class="item-info"><div class="item-title">💰 ${escapeHtml(f.title)}</div></div></div>`;
            });
            container.innerHTML = html || '<p style="font-size:12px; color:var(--text-secondary);">Ничего не найдено</p>';
        }

        function selectStickerColor(color, el) {
            selectedColor = color;
            document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function saveNote() {
            const text = document.getElementById('taskText').value.trim();
            const category = document.getElementById('noteCategory').value;
            if (!text) return;

            if (editingNoteId) {
                notes = notes.map(n => n.id === editingNoteId ? { ...n, text, category, color: selectedColor } : n);
            } else {
                notes.unshift({ id: Date.now(), text, category, color: selectedColor, date: getTodayDate() });
            }

            resetNoteForm();
            saveAndRender();
            openTab('home');
        }

        function editNote(id) {
            const n = notes.find(item => item.id === id);
            if (!n) return;
            editingNoteId = id;
            document.getElementById('taskText').value = n.text;
            document.getElementById('noteCategory').value = n.category || 'Заметка';
            document.getElementById('saveNoteBtn').innerText = 'Сохранить';
            document.getElementById('cancelEditBtn').style.display = 'inline-flex';
            
            selectedColor = n.color || 'sage';
            openTab('tasks');
        }

        function resetNoteForm() {
            editingNoteId = null;
            document.getElementById('taskText').value = '';
            document.getElementById('saveNoteBtn').innerText = '+ Сохранить';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveAndRender();
        }

        function renderNotesAndStickers() {
            const board = document.getElementById('stickersBoard');
            if (notes.length === 0) {
                board.innerHTML = '<p style="color:var(--text-secondary); font-size:12px; grid-column: 1/-1;">На доске пока нет стикеров. Перейди во вкладку «Заметки» и создай первую запись!</p>';
            } else {
                board.innerHTML = notes.map(n => `
                    <div class="sticker-card ${n.color || 'sage'}">
                        <div>
                            <div class="sticker-tag">${escapeHtml(n.category || 'Заметка')}</div>
                            <div class="sticker-text">${escapeHtml(n.text)}</div>
                        </div>
                        <div class="sticker-footer">
                            <span>${n.date}</span>
                            <div style="display:flex; gap:4px;">
                                <button class="mini-btn" onclick="editNote(${n.id})">✏️</button>
                                <button class="mini-btn" onclick="deleteNote(${n.id})">✕</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            const list = document.getElementById('tasksList');
            if (notes.length === 0) {
                list.innerHTML = '<p style="color:var(--text-secondary); font-size:12px;">Записей нет</p>';
            } else {
                list.innerHTML = notes.map(n => `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-title">${escapeHtml(n.text)}</div>
                            <div class="item-sub">
                                <span class="badge">${n.category || 'Заметка'}</span>
                                <span class="badge">${n.date}</span>
                            </div>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button class="del-btn" style="color:var(--accent);" onclick="editNote(${n.id})">Изменить</button>
                            <button class="del-btn" onclick="deleteNote(${n.id})">Удалить</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function addWorkout() {
            const ex = document.getElementById('workEx').value.trim();
            const weight = document.getElementById('workWeight').value.trim();
            const sets = document.getElementById('workSets').value.trim();
            if (!ex) return;
            workouts.unshift({ id: Date.now(), ex, weight: weight || '0', sets: sets || '-', date: getTodayDate() });
            saveAndRender();
            document.getElementById('workEx').value = ''; document.getElementById('workWeight').value = ''; document.getElementById('workSets').value = '';
        }
        function deleteWorkout(id) { workouts = workouts.filter(w => w.id !== id); saveAndRender(); }

        function renderWorkouts() {
            const container = document.getElementById('workoutsList');
            if (workouts.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:12px;">Нет тренировок</p>'; return; }
            container.innerHTML = workouts.map(w => `
                <div class="list-item">
                    <div class="item-info">
                        <div class="item-title">${escapeHtml(w.ex)}</div>
                        <div class="item-sub"><span class="badge">🏋️ ${w.weight} кг</span><span class="badge">🔁 ${escapeHtml(w.sets)}</span><span class="badge">${w.date}</span></div>
                    </div>
                    <button class="del-btn" onclick="deleteWorkout(${w.id})">Удалить</button>
                </div>
            `).join('');
        }

        function switchFinSubTab(type) {
            document.getElementById('finSubOps').style.display = type === 'ops' ? 'block' : 'none';
            document.getElementById('finSubCalc').style.display = type === 'calc' ? 'block' : 'none';
            document.getElementById('subBtnOps').className = type === 'ops' ? 'active' : '';
            document.getElementById('subBtnCalc').className = type === 'calc' ? 'active' : '';
        }

        function addFinance(type) {
            const amount = parseFloat(document.getElementById('finAmount').value);
            const title = document.getElementById('finTitle').value.trim();
            if (!amount || amount <= 0) return;
            finance.unshift({ id: Date.now(), type, amount, title: title || (type === 'income' ? 'Доход' : 'Расход'), date: getTodayDate() });
            saveAndRender();
            document.getElementById('finAmount').value = ''; document.getElementById('finTitle').value = '';
        }
        function deleteFinance(id) { finance = finance.filter(f => f.id !== id); saveAndRender(); }

        function renderFinance() {
            const container = document.getElementById('financeList');
            let balance = 0;
            finance.forEach(f => { if (f.type === 'income') balance += f.amount; else balance -= f.amount; });
            
            document.getElementById('balanceVal').innerText = balance.toLocaleString();
            document.getElementById('statBalance').innerText = balance.toLocaleString() + ' ₼';

            if (finance.length === 0) { container.innerHTML = '<p style="color:var(--text-secondary); font-size:12px;">История пуста</p>'; return; }
            container.innerHTML = finance.map(f => `
                <div class="list-item">
                    <div class="item-info"><div class="item-title">${escapeHtml(f.title)}</div><div class="item-sub"><span class="badge">${f.date}</span></div></div>
                    <div style="margin-right:8px; font-weight:700; font-size:13px; color:${f.type === 'income' ? 'var(--accent-green)' : 'var(--accent-red)'};">${f.type === 'income' ? '+' : '-'}${f.amount} ₼</div>
                    <button class="del-btn" onclick="deleteFinance(${f.id})">✕</button>
                </div>
            `).join('');
        }

        let calcVal = '0';
        function calcInput(val) {
            if (val === 'C') { calcVal = '0'; }
            else if (val === '⌫') { calcVal = calcVal.length > 1 ? calcVal.slice(0, -1) : '0'; }
            else {
                if (calcVal === '0' && val !== '.') calcVal = val;
                else calcVal += val;
            }
            document.getElementById('calcDisplay').value = calcVal;
        }

        function calcEquals() {
            try {
                calcVal = eval(calcVal.replace(/×/g, '*').replace(/÷/g, '/')).toString();
                document.getElementById('calcDisplay').value = calcVal;
            } catch (e) {
                document.getElementById('calcDisplay').value = 'Ошибка';
                calcVal = '0';
            }
        }

        function copyCalcToFinance() {
            const val = parseFloat(document.getElementById('calcDisplay').value);
            if (!isNaN(val)) {
                document.getElementById('finAmount').value = val;
                switchFinSubTab('ops');
            }
        }

        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.style.display = 'none');
            document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).style.display = 'block';
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        function getTodayDate() {
            const d = new Date();
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
            return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
        }

        function saveAndRender() {
            localStorage.setItem('my_notes', JSON.stringify(notes));
            localStorage.setItem('my_workouts', JSON.stringify(workouts));
            localStorage.setItem('my_finance', JSON.stringify(finance));

            document.getElementById('statNotesCount').innerText = notes.length;
            document.getElementById('statWorkoutsCount').innerText = workouts.length;

            renderNotesAndStickers();
            renderWorkouts();
            renderFinance();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ notes, workouts, finance }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `my_diary_backup_${getTodayDate()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click(); downloadAnchor.remove();
        }

        function importData(e) {
            const fileReader = new FileReader();
            fileReader.onload = function (event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.notes) notes = data.notes;
                    if (data.workouts) workouts = data.workouts;
                    if (data.finance) finance = data.finance;
                    saveAndRender(); alert('Данные успешно восстановлены!');
                } catch (err) { alert('Ошибка чтения файла бэкапа'); }
            };
            fileReader.readAsText(e.target.files[0]);
        }

        function clearAllData() {
            if (confirm('Сбросить и удалить абсолютно все данные?')) {
                localStorage.clear(); notes = []; workouts = []; finance = []; saveAndRender();
            }
        }

        function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        document.getElementById('currentDateStr').innerText = 'Сегодня: ' + getTodayDate();
        saveAndRender();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    </script>
</body>
</html>
